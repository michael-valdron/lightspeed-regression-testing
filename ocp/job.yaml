apiVersion: batch/v1
kind: Job
metadata:
  name: lightspeed-tests
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: lightspeed-regression
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: lightspeed-regression-testing
                  service: lightspeed-core
              topologyKey: kubernetes.io/hostname
      restartPolicy: Never
      containers:
        - name: lightspeed-regression-test-runner
          image: quay.io/rh-ee-jdubrick/lightspeed-regression-runner:latest
          envFrom:
            - secretRef:
                name: llama-stack-secrets
          env:
            - name: LS_BASE_URL
              value: http://lightspeed-svc:8080
            - name: FEEDBACK_STORAGE_PATH
              value: /tmp/data/feedback
            - name: RESULTS_DIR
              value: /tmp/results
            - name: PROVIDER_MODE
              value: vllm_only
            - name: READINESS_GRACE_SECONDS
              value: "15"
          args:
            - pytest
            - tests
            - -v
          volumeMounts:
            - name: feedback-data
              mountPath: /tmp/data/feedback
              subPath: feedback
            - name: feedback-data
              mountPath: /tmp/results
              subPath: results
      volumes:
        - name: feedback-data
          persistentVolumeClaim:
            claimName: feedback-data
